# Minimal Supabase CLI config. Functions verify the caller in code (see each
# index.ts), so the gateway's JWT check is off: ingest is called by a database
# trigger with a shared secret, slack by Slack with a signed request, and ask
# validates the user's token itself.
project_id = "opspilot"

[functions.ask]
verify_jwt = false

[functions.ingest]
verify_jwt = false

[functions.slack]
verify_jwt = false
