# One-click deployment of the Supabase side, from GitHub (no local terminal needed).
# Actions tab -> "Deploy to Supabase" -> Run workflow.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_URL, SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DB_PASSWORD, GEMINI_API_KEY, DEMO_PASSWORD
# Optional secrets: SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN
# Optional variables: GEMINI_CHAT_MODEL, PRICE_IN_PER_M, PRICE_OUT_PER_M, USD_INR, MATCH_COUNT,
#                     FULL_TEXT_WEIGHT, SEMANTIC_WEIGHT, CHUNK_MAX_TOKENS
name: Deploy to Supabase

on:
  # Continuous deployment: any push to main that touches the backend redeploys it.
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ingest:
        description: "Upload and ingest the dataset (skip on redeploys)"
        type: boolean
        default: true

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GEMINI_CHAT_MODEL: ${{ vars.GEMINI_CHAT_MODEL || 'gemini-flash-lite-latest' }}
      GEMINI_EMBED_MODEL: gemini-embedding-001
      PRICE_IN_PER_M: ${{ vars.PRICE_IN_PER_M }}
      PRICE_OUT_PER_M: ${{ vars.PRICE_OUT_PER_M }}
      PRICE_EMBED_PER_M: "0.15"
      USD_INR: ${{ vars.USD_INR || '85' }}
      MATCH_COUNT: ${{ vars.MATCH_COUNT || '8' }}
      FULL_TEXT_WEIGHT: ${{ vars.FULL_TEXT_WEIGHT || '1' }}
      SEMANTIC_WEIGHT: ${{ vars.SEMANTIC_WEIGHT || '1' }}
      CHUNK_MAX_TOKENS: ${{ vars.CHUNK_MAX_TOKENS || '500' }}
      CHUNK_OVERLAP_TOKENS: "50"
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
      GEMINI_THINKING_BUDGET: ${{ vars.GEMINI_THINKING_BUDGET }}
      SUPABASE_YES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Clean up pasted secrets (strip spaces and line breaks)
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_PASSWORD GEMINI_API_KEY DEMO_PASSWORD SLACK_SIGNING_SECRET SLACK_BOT_TOKEN GEMINI_CHAT_MODEL PRICE_IN_PER_M PRICE_OUT_PER_M USD_INR; do
            raw="${!v}"
            clean=$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "$v=$clean" >> "$GITHUB_ENV"
            fi
          done

      - name: Check required secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_PASSWORD GEMINI_API_KEY DEMO_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          case "${SUPABASE_URL%/}" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL should look like https://<ref>.supabase.co"; exit 1;; esac
          if ! printf '%s' "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF must be exactly 20 lowercase letters (the Project ID in Supabase -> Project Settings -> General)"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Generate the webhook secret for this deployment
        run: |
          s=$(openssl rand -hex 32)
          echo "::add-mask::$s"
          echo "WEBHOOK_SECRET=$s" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Pinned to CLI v2: in v3, `db push` targets the local stack unless told otherwise.
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Set Edge Function secrets
        run: |
          f=$(mktemp)
          for v in GEMINI_API_KEY GEMINI_CHAT_MODEL GEMINI_EMBED_MODEL PRICE_IN_PER_M PRICE_OUT_PER_M PRICE_EMBED_PER_M USD_INR \
                   MATCH_COUNT FULL_TEXT_WEIGHT SEMANTIC_WEIGHT CHUNK_MAX_TOKENS CHUNK_OVERLAP_TOKENS WEBHOOK_SECRET \
                   GEMINI_THINKING_LEVEL GEMINI_THINKING_BUDGET \
                   SLACK_SIGNING_SECRET SLACK_BOT_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$f"; fi
          done
          supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$f"

      - name: Deploy Edge Functions
        run: supabase functions deploy ask ingest slack --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt

      - name: Seed config, demo users and rate contracts
        run: npx tsx scripts/seed.ts

      - name: Upload and ingest the dataset
        # Safe to repeat: files already uploaded (same checksum) are skipped.
        if: ${{ github.event_name == 'push' || inputs.ingest }}
        run: npx tsx scripts/bulk-ingest.ts

      - name: Smoke test (ingestion counts + 3 real questions)
        run: npx tsx scripts/smoke.ts

      - name: Summary
        if: always()
        run: |
          {
            echo "## OpsPilot deployment"
            echo "- Project: \`$SUPABASE_PROJECT_REF\`"
            echo "- Chat model: \`$GEMINI_CHAT_MODEL\`"
            echo "- Functions: \`$SUPABASE_URL/functions/v1/{ask,ingest,slack}\`"
            echo "- Demo users: admin@ / buyer@ / finance@ / warehouse@prakriti.demo (password = DEMO_PASSWORD secret)"
            echo "- Next: deploy web/ on Netlify with VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
