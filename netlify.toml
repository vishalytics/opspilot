# Netlify hosts only the static React app. All server logic runs in Supabase.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
